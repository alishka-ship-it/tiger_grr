<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="body">
    <header class="head">
        <h1 class="pizzashop">PIZZASHOP</h1>
        <ul>
            <li>Home</li>
            <li>Menu</li>
            <li>Events</li>
            <li>About Us</li>
        </ul>
        <div class="headBtns">
            <button class="login">Log in</button>
            <button class="cart"><img src="./img/cart.png" alt=""></button>
        </div>
    </header>
    <section class="section1">
        <div class="section1Text">
            <img class="line1" src="./img/line1.png" alt="">
            <img class="light" src="./img/lightning.png" alt="">
            <h1 class="delivery">The Fastest <br> Pizza‎ ‎ ‎ ‎ ‎Delivery</h1>
            <p>We will deliver juicy pizza for your family in 30 <br> minutes, if the courier is late - <span>pizza is
                    free!</span></p>
            <div class="processImg">
                <p>Cooking process:</p>
                <img class="cookprocess" src="./img/cookprocess.png" alt="">
                <img class="stop" src="./img/stop.png" alt="">
                <img class="krugStop" src="./img/krugStop.png" alt="">
            </div>
            <div class="btnGroup">
                <button class="btnOrder">To Order</button>
                <button class="btnMenu">Pizza-Menu</button>
            </div>
        </div>
        <div class="section1Img">
            <img class="section1img1" src="./img/section1img.png" alt="">
            <img class="section1img2" src="./img/fries.png" alt="">
            <img class="section1img3" src="./img/pizzasec1.png" alt="">
        </div>
        <img class="line2" src="./img/line2.png" alt="">
    </section>
</body>

</html>
